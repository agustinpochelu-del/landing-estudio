<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estados contables</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E3B34'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23D9BC6A' text-anchor='middle'%3EAP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="impresion.css?v=54">
<script>
  /* La paleta se aplica antes de pintar, para que no haya un parpadeo del
     color anterior. Sale de `?paleta=` o de lo último que se eligió. */
  (function () {
    var q = new URLSearchParams(location.search).get("paleta");
    var p = q !== null ? q : (localStorage.getItem("paleta") || "");
    if (p) document.documentElement.dataset.paleta = p;
  })();
</script>
</head>
<body>

<div class="barra no-imprimir">
  <span id="titulo-barra">Estados contables</span>
  <span class="acciones">
    <label class="elige paleta">Paleta
      <select id="paleta">
        <option value="">Actual</option>
        <option value="salvia">Salvia</option>
        <option value="bruma">Bruma</option>
        <option value="arena">Arena</option>
      </select>
    </label>
    <span class="dice-firma" id="dice-firma"></span>
    <button type="button" id="pedir-firma">Firmar</button>
    <span class="firma" id="caja-firma" hidden>
      <input type="password" id="clave-firma" placeholder="clave" autocomplete="current-password">
      <button type="button" id="aplicar-firma">Aplicar</button>
    </span>
    <a href="tablero.html">Volver</a>
    <button type="button" onclick="window.print()">Imprimir o guardar en PDF</button>
  </span>
</div>

<!-- Firmar sin el servidor local: las imágenes las trae quien firma, se usan
     para dibujar la hoja y no se guardan en ningún lado. -->
<dialog id="dialogo-firmas" class="no-imprimir">
  <form method="dialog" class="firmas-subir">
    <h2>Firmar el balance</h2>
    <p class="dice">
      Elegí las imágenes de las firmas: escaneadas o fotografiadas sobre papel blanco,
      PNG o JPG. Se usan para dibujar las hojas y <strong>no se guardan en ningún
      lado</strong>: al recargar la página, el balance vuelve sin firmar.
    </p>

    <label class="una">
      <span class="quien" id="et-profesional">La firma del profesional</span>
      <input type="file" id="firma-profesional" accept="image/png,image/jpeg">
      <span class="previa" id="previa-profesional"></span>
    </label>

    <label class="una">
      <span class="quien" id="et-representante">La firma del representante</span>
      <input type="file" id="firma-representante" accept="image/png,image/jpeg">
      <span class="previa" id="previa-representante"></span>
    </label>

    <p class="alto">
      <label>Alto en la hoja
        <input type="number" id="alto-firmas" value="12" min="4" max="20" step="1"> mm</label>
      <span class="dice" id="dice-subir"></span>
    </p>

    <p class="botones">
      <button type="button" id="aplicar-subidas">Aplicar al balance</button>
      <button type="submit" value="cancelar" class="tenue">Cancelar</button>
    </p>
  </form>
</dialog>

<main id="paquete"></main>

<script src="bolsa.js?v=1"></script>
<script src="rubrica.js?v=1"></script>
<script src="motor.js?v=29"></script>
<script src="diario.js?v=41"></script>
<script src="informe.js?v=35"></script>
<script>
  /* Firmar.

     El balance se arma sin firmas y se imprime sin firmas: las firmas son lo
     último y son una decisión, no un estado del archivo. El servidor manda las
     imágenes sólo contra la clave, y sólo mientras la página esté abierta:
     recargar devuelve el balance sin firmar. */
  (function () {
    var pedir = document.getElementById("pedir-firma");
    var caja = document.getElementById("caja-firma");
    var clave = document.getElementById("clave-firma");
    var aplicar = document.getElementById("aplicar-firma");
    var dice = document.getElementById("dice-firma");

    function avisar(texto, mal) {
      dice.textContent = texto || "";
      dice.className = "dice-firma" + (mal ? " mal" : "");
    }

    pedir.onclick = function () {
      if (window.Informe && window.Informe.firmado()) {
        window.Informe.desfirmar();
        pedir.textContent = "Firmar";
        avisar("");
        return;
      }
      if (!conServidor) return abrirDialogo();
      caja.hidden = !caja.hidden;
      if (!caja.hidden) clave.focus();
    };

    aplicar.onclick = async function () {
      if (!window.Informe) return avisar("el informe todavía no está armado", true);
      aplicar.disabled = true;
      avisar("Firmando…");
      try {
        var r = await window.Informe.firmar(clave.value);
        clave.value = "";
        caja.hidden = true;
        pedir.textContent = "Sacar las firmas";
        avisar(r.faltan.length
          ? "Firmado, pero falta cargar la firma de: " + r.faltan.join(", ")
          : "Firmado");
      } catch (e) {
        avisar(e.message, true);
      }
      aplicar.disabled = false;
    };

    clave.onkeydown = function (e) { if (e.key === "Enter") aplicar.click(); };

    /* Dos caminos para lo mismo. Con el servidor local, las firmas salen del
       reservorio contra la clave. Sin servidor —la aplicación publicada— las
       sube quien firma, se usan y no se guardan: pedir una clave para usar un
       archivo que trajo la misma persona no agrega nada. */
    var conServidor = false;
    window.Bolsa.hayServidor().then(function (hay) { conServidor = hay; });

    var dialogo = document.getElementById("dialogo-firmas");
    var subidas = {};

    function previa(donde, imagen) {
      var alto = Number(document.getElementById("alto-firmas").value) || 12;
      donde.innerHTML = imagen
        ? '<img src="' + imagen + '" style="height:' + (alto * 96 / 25.4) + 'px">'
        : "";
    }

    async function tomar(cual, entrada, donde) {
      var d = document.getElementById("dice-subir");
      d.textContent = "";
      if (!entrada.files.length) { subidas[cual] = null; previa(donde, null); return; }
      try {
        subidas[cual] = { imagen: await window.Rubrica.deArchivo(entrada.files[0]) };
        previa(donde, subidas[cual].imagen);
      } catch (e) {
        subidas[cual] = null;
        previa(donde, null);
        d.innerHTML = '<span class="mal">' + e.message + "</span>";
      }
    }

    ["profesional", "representante"].forEach(function (cual) {
      var entrada = document.getElementById("firma-" + cual);
      var donde = document.getElementById("previa-" + cual);
      entrada.onchange = function () { tomar(cual, entrada, donde); };
    });

    document.getElementById("alto-firmas").oninput = function () {
      previa(document.getElementById("previa-profesional"),
        subidas.profesional && subidas.profesional.imagen);
      previa(document.getElementById("previa-representante"),
        subidas.representante && subidas.representante.imagen);
    };

    document.getElementById("aplicar-subidas").onclick = function () {
      var d = document.getElementById("dice-subir");
      if (!subidas.profesional && !subidas.representante) {
        d.innerHTML = '<span class="mal">No elegiste ninguna imagen.</span>';
        return;
      }
      var alto = Number(document.getElementById("alto-firmas").value) || 12;
      var puestas = {};
      ["profesional", "representante"].forEach(function (cual) {
        if (subidas[cual]) puestas[cual] = { imagen: subidas[cual].imagen, alto_mm: alto };
      });
      try {
        window.Informe.ponerFirmas(puestas);
      } catch (e) {
        d.innerHTML = '<span class="mal">' + e.message + "</span>";
        return;
      }
      dialogo.close();
      pedir.textContent = "Sacar las firmas";
      avisar(subidas.profesional && subidas.representante
        ? "Firmado" : "Firmado con una sola firma");
    };

    function abrirDialogo() {
      var f = window.Informe.firmantes();
      if (f) {
        document.getElementById("et-profesional").textContent =
          "La firma de " + f.profesional;
        document.getElementById("et-representante").textContent = f.representante
          ? "La firma de " + f.representante +
            (f.cargo ? " (" + f.cargo + ")" : "")
          : "La firma del representante";
      }
      dialogo.showModal();
    }

    /* Se puede entrar con `&firmar=1` —así lo abre la pantalla de las firmas— y
       entonces el cuadro de la clave ya está abierto y esperando. */
    if (new URLSearchParams(location.search).get("firmar") === "1") {
      window.Bolsa.hayServidor().then(function (hay) {
        if (!hay) return;
        caja.hidden = false;
        avisar("Escribí la clave y apretá Aplicar");
        setTimeout(function () { clave.focus(); }, 300);
      });
    }
  })();

  (function () {
    var s = document.getElementById("paleta");
    if (!s) return;
    s.value = document.documentElement.dataset.paleta || "";
    s.onchange = function () {
      if (this.value) {
        document.documentElement.dataset.paleta = this.value;
        localStorage.setItem("paleta", this.value);
      } else {
        delete document.documentElement.dataset.paleta;
        localStorage.removeItem("paleta");
      }
    };
  })();
</script>
</body>
</html>
